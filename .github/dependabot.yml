version: 2

# Dependency maintenance policy: see DEPENDENCY_MAINTENANCE.md.
updates:
    - package-ecosystem: npm
      # The pnpm workspace is defined at the repository root, so one entry covers every package.
      directory: '/'
      target-branch: main
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: Europe/Belgrade
      # Bound the review queue; the group and major pull requests stay independently reviewable.
      open-pull-requests-limit: 5
      versioning-strategy: increase
      labels:
          - dependencies
      commit-message:
          prefix: 'chore(deps)'
          include: scope
      # Patch and minor updates share one weekly pull request. Major updates are intentionally left
      # out of the group so each one opens as its own pull request with its own migration review.
      groups:
          npm-patch-minor:
              patterns:
                  - '*'
              update-types:
                  - minor
                  - patch
